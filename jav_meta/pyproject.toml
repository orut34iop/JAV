[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jav-meta"
version = "0.1.0"
description = "Local JAV metadata database and scraper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "httpx[http2]>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "loguru>=0.7.0",
    "pillow>=10.3.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "aiofiles>=23.2.0",
]

[project.scripts]
javdb = "jav_meta.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["jav_meta"]
